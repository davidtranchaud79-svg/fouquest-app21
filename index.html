<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fouquet’s Joy • Gold Motion v17.5</title>

  <meta name="theme-color" content="#5A0D0D"/>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script defer src="app.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">F</div>
      <div class="brand-text">
        <div class="brand-title">Fouquet’s Joy</div>
        <div class="brand-sub">Gold Motion • Ivoire & Or</div>
      </div>
    </div>

    <div class="actions">
      <span id="syncBadge" class="status-badge offline">Hors ligne</span>
      <button class="btn ghost" id="btnSync">⇅ Synchroniser</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="dashboard">📊 Dashboard</button>
    <button class="tab" data-view="pertes">🗑️ Pertes</button>
    <button class="tab" data-view="invj">📦 Inventaire J.</button>
    <button class="tab" data-view="invm">🏷️ Inventaire M.</button>
    <button class="tab" data-view="recettes">🍽️ Recettes</button>
    <button class="tab" data-view="settings">⚙️ Paramètres</button>
  </nav>

  <main id="app" class="container"></main>

  <footer class="footer">
    © Fouquet’s Joy – Gold Motion v17.5
  </footer>

  <!-- DASHBOARD -->
  <template id="tpl-dashboard">
    <section class="section">
      <div class="grid-3">
        <div class="card kpi">
          <div class="kpi-title">Valeur du stock</div>
          <div class="kpi-value" id="kpiStock">—</div>
          <div class="kpi-sub" id="kpiStockQte">—</div>
        </div>

        <div class="card kpi">
          <div class="kpi-title">Pertes du mois</div>
          <div class="kpi-value" id="kpiPertes">—</div>
          <div class="kpi-sub" id="kpiPertesLabel">Poids total des pertes</div>
        </div>

        <div class="card kpi">
          <div class="kpi-title">Alertes seuil</div>
          <div class="kpi-value" id="kpiSeuils">—</div>
          <div class="kpi-sub">produits</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📋 État du stock courant</div>
        <table class="list" id="tableStockDetail">
          <thead>
            <tr>
              <th>Produit</th>
              <th>Qté</th>
              <th>Unité</th>
              <th>Prix €</th>
              <th>Valeur €</th>
              <th>Zone</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="card">
        <div class="card-title">📉 Analyse des pertes</div>
        <div class="toggle-container">
          <span>Vue simple</span>
          <label class="toggle-switch">
            <input type="checkbox" id="togglePareto">
            <span class="slider"></span>
          </label>
          <span>Pareto</span>
        </div>
        <canvas id="chartPertes" height="140"></canvas>
        <div id="pertesLegend"></div>
      </div>
    </section>
  </template>

  <!-- PERTES -->
  <template id="tpl-pertes">
    <section class="section">
      <div class="card">
        <div class="card-title">🗑️ Saisie des pertes</div>

        <div class="grid">
          <div class="input-field">
            <label for="pertesProduit">Produit</label>
            <input id="pertesProduit" list="dlProduitsPertes" placeholder="Choisir ou saisir">
            <datalist id="dlProduitsPertes"></datalist>
          </div>

          <div class="input-field">
            <label for="pertesQte">Quantité</label>
            <input id="pertesQte" type="number" step="0.001" placeholder="Ex. 1.200">
          </div>

          <div class="input-field">
            <label for="pertesUnite">Unité</label>
            <input id="pertesUnite" placeholder="KG / L / PCS">
          </div>

          <div class="input-field">
            <label for="pertesMotif">Motif</label>
            <input id="pertesMotif" placeholder="DLUO / casse / surcuisson">
          </div>

          <div class="input-field">
            <label for="pertesComment">Commentaire</label>
            <input id="pertesComment" placeholder="Optionnel">
          </div>
        </div>

        <div class="row-actions">
          <button class="btn" id="btnSavePerte">💾 Enregistrer</button>
          <button class="btn ghost" id="btnResetPerte">↩️ Réinitialiser</button>
        </div>
      </div>
    </section>
  </template>

  <!-- INVENTAIRE JOURNALIER -->
  <template id="tpl-invj">
    <section class="section">
      <div class="card">
        <div class="card-title">📦 Inventaire journalier</div>

        <div class="grid">
          <div class="input-field">
            <label for="invjProduit">Produit</label>
            <input id="invjProduit" list="dlProduitsInvJ" placeholder="Nom du produit">
            <datalist id="dlProduitsInvJ"></datalist>
          </div>

          <div class="input-field">
            <label for="invjQte">Quantité</label>
            <input id="invjQte" type="number" step="0.001" placeholder="Ex. 2.500">
          </div>

          <div class="input-field">
            <label for="invjUnite">Unité</label>
            <input id="invjUnite" placeholder="KG / L / PCS">
          </div>
        </div>

        <div class="row-actions">
          <button class="btn success" id="btnInvJEntree">⬆️ Entrée</button>
          <button class="btn danger" id="btnInvJSortie">⬇️ Sortie</button>
          <button class="btn ghost" id="btnResetInvJ">↩️ Réinitialiser</button>
        </div>
      </div>
    </section>
  </template>

  <!-- INVENTAIRE MENSUEL -->
  <template id="tpl-invm">
    <section class="section">
      <div class="card invm-header">
        <div class="card-title">🏷️ Inventaire mensuel</div>

        <div class="grid" style="align-items:end;">
          <div class="input-field">
            <label for="invmZone">Poste / zone</label>
            <select id="invmZone"></select>
          </div>

          <div class="input-field">
            <label for="invmMois">Mois</label>
            <input type="month" id="invmMois">
          </div>

          <div class="input-field">
            <button class="btn gold" id="btnGenSheet">📄 Générer la feuille</button>
          </div>
        </div>
      </div>

      <div class="smart-card">
        <div class="smart-title">🧠 Inventaire intelligent</div>

        <p class="smart-help">
          Tu saisis ton article terrain. L’application cherche l’article Axel le plus proche.
          À l’enregistrement, elle remplit le SAS intelligent ET l’inventaire mensuel classique.
        </p>

        <div class="grid">
          <div class="input-field">
            <label for="smartArticle">Article terrain</label>
            <input id="smartArticle" placeholder="Ex. beurre doux, bacon, avocat...">
          </div>

          <div class="input-field">
            <label for="smartQte">Quantité</label>
            <input id="smartQte" type="number" step="0.001" placeholder="Ex. 2.500">
          </div>

          <div class="input-field">
            <label for="smartUnite">Unité</label>
            <input id="smartUnite" placeholder="KG / L / PCS">
          </div>

          <div class="input-field">
            <button class="btn success" id="btnSmartSave">✅ Enregistrer intelligemment</button>
          </div>
        </div>

        <div id="smartSuggestions" class="smart-suggestions">
          <div class="muted-dark">Aucune proposition fixe.</div>
        </div>

        <div id="smartStatus" class="smart-status"></div>

        <div class="smart-bulk">
          <label for="smartBulkText">Collage inventaire terrain en masse</label>
          <textarea id="smartBulkText" placeholder="Exemple :
ABRICOT    0.780    KG
AVOCAT     0.800    KG
BACON      2.600    KG"></textarea>

          <div class="row-actions">
            <button class="btn gold" id="btnSmartBulkImport">⚡ Importer le collage intelligemment</button>
          </div>
        </div>
      </div>

      <div class="card invm-body">
        <div class="card-title">📋 Feuille d’inventaire classique</div>

        <datalist id="dlProduitsInvM"></datalist>

        <table class="list inv-table" id="invTable">
          <thead>
            <tr>
              <th>Produit</th>
              <th>Quantité</th>
              <th>Unité</th>
              <th>Commentaire</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <div class="row-actions center">
          <button class="btn ghost" id="btnAddRow">➕ Ajouter une ligne</button>
          <button class="btn success" id="btnSaveInv">💾 Valider l’inventaire classique</button>
        </div>
      </div>
    </section>
  </template>

  <!-- RECETTES -->
  <template id="tpl-recettes">
    <section class="section">
      <div class="card">
        <div class="card-title">🍽️ Recettes</div>

        <div class="grid" style="margin-bottom:10px; align-items:end;">
          <div class="input-field" style="flex:2;">
            <label for="recetteSearch">Recherche</label>
            <input id="recetteSearch" placeholder="Rechercher une recette...">
          </div>
        </div>

        <div id="recettesList" class="grid-cards"></div>
      </div>
    </section>
  </template>

  <!-- PARAMÈTRES -->
  <template id="tpl-settings">
    <section class="section">
      <div class="card">
        <div class="card-title">⚙️ Paramètres</div>

        <div class="grid">
          <div class="input-field">
            <label for="setEtab">Établissement</label>
            <input id="setEtab" placeholder="Fouquet’s Joy">
          </div>

          <div class="input-field">
            <label for="setTz">Fuseau horaire</label>
            <select id="setTz">
              <option>Europe/Paris</option>
              <option>Europe/Rome</option>
              <option>America/New_York</option>
            </select>
          </div>

          <div class="input-field">
            <label for="setEmail">Email Cost-Control</label>
            <input id="setEmail" placeholder="costcontrol@fouquets.fr">
          </div>

          <div class="input-field">
            <label for="setLang">Langue</label>
            <select id="setLang">
              <option value="fr">Français</option>
              <option value="en">English</option>
              <option value="it">Italiano</option>
              <option value="es">Español</option>
            </select>
          </div>
        </div>

        <div class="row-actions">
          <button class="btn" id="btnSetSave">💾 Enregistrer</button>
        </div>
      </div>
    </section>
  </template>
</body>
</html>
