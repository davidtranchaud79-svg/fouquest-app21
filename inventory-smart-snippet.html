<!--
MODULE INVENTAIRE INTELLIGENT
À intégrer dans ton index.html existant, dans une vue inventaire.

Important :
Pour l’instant, ne le colle pas si tu veux garder ton application intacte.
Ce bloc sert uniquement quand on branche le module dans l’interface.
-->

<section id="inventorySmartModule" class="smart-card">
  <h2>Inventaire intelligent</h2>

  <p class="smart-muted">
    Saisie guidée : le système range automatiquement dans le SAS et apprend les alias.
  </p>

  <div class="smart-grid">
    <label>
      Mois
      <input id="smartMois" type="text" placeholder="2026-05">
    </label>

    <label>
      Poste
      <select id="smartPoste"></select>
    </label>
  </div>

  <label>
    Article terrain
    <input id="smartArticle" type="text" placeholder="Ex : bacon, avocat, beans...">
  </label>

  <div id="smartSuggestions" class="smart-suggestions"></div>

  <div class="smart-grid">
    <label>
      Quantité
      <input id="smartQte" type="number" step="0.001" placeholder="0.000">
    </label>

    <label>
      Unité
      <select id="smartUnite">
        <option value="KG">KG</option>
        <option value="L">L</option>
        <option value="PCS">PCS</option>
        <option value="G">G</option>
        <option value="ML">ML</option>
      </select>
    </label>
  </div>

  <button id="smartSave" type="button" class="smart-btn">
    Enregistrer dans l’inventaire
  </button>

  <hr>

  <label>
    Collage inventaire terrain en masse
    <textarea id="smartBulkText" rows="8" placeholder="Ex :
BEANS    2    KG
BACON    1.5    KG
AVOCAT   12   PCS"></textarea>
  </label>

  <button id="smartBulkRun" type="button" class="smart-btn secondary">
    Importer le collage
  </button>

  <div id="smartStatus" class="smart-status"></div>
</section>

<!--
